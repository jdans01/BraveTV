name: Build BraveTV APK

on:
  push:
    branches: [ main, master, "claude/**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets.* can't be referenced directly in a step's `if:` (GitHub rejects the whole
    # workflow file for it) — route it through a job-level env var instead, which *can*
    # read secrets in its value.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bravetv-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/bravetv-release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: .
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Same signing key on every run (from the secrets above) is what makes in-app
        # updates installable over the previous version at all — a debug/ephemeral key
        # that changes every build never can be, no matter what the app itself does.
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/BraveTVBrowser.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraveTV-Browser-APK
          path: dist/BraveTVBrowser.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "BraveTV Browser ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: dist/BraveTVBrowser.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
