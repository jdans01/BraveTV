name: Build BraveTV APK

on:
  push:
    branches: [ main, master, "claude/**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: .
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BraveTVBrowser.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BraveTV-Browser-APK
          path: dist/BraveTVBrowser.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "BraveTV Browser ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: dist/BraveTVBrowser.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
